<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ソロプレイ・テニスゲーム</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
    }
    #gameContainer {
      display: inline-block;
      position: relative;
    }
    canvas {
      background: #000;
      border: 3px solid #fff;
      display: block;
      margin: 10px auto;
      max-width: 100%;
      height: auto;
    }
    .status {
      font-size: 18px;
      margin-bottom: 8px;
      color: #00ffcc;
      font-weight: bold;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .btn {
      width: 80px;
      height: 60px;
      font-size: 24px;
      background: #444;
      color: white;
      border: 2px solid #666;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:active { background: #666; }
  </style>
</head>
<body>

  <h1>ソロプレイ 2Dテニス</h1>
  <div class="status" id="statusText">YOU（青） vs CPU（赤） [10点先取]</div>
  
  <div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
  </div>

  <div class="controls">
    <button class="btn" id="upBtn">▲</button>
    <button class="btn" id="downBtn">▼</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText");

    let p1Y = 160;
    let cpuY = 160;
    let ballX = 300;
    let ballY = 200;
    let ballVx = 5;
    let ballVy = 5;
    let scorePlayer = 0;
    let scoreCpu = 0;
    let isGameOver = false;

    const paddleHeight = 80;
    const paddleWidth = 10;
    const cpuSpeed = 3.8;
    const WINNING_SCORE = 10; // 10点で勝利

    function moveUp() {
      if (isGameOver) return;
      p1Y = Math.max(0, p1Y - 25);
    }

    function moveDown() {
      if (isGameOver) return;
      p1Y = Math.min(canvas.height - paddleHeight, p1Y + 25);
    }

    window.addEventListener("keydown", (e) => {
      if (isGameOver && e.key === ' ') {
        restartGame();
        return;
      }
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') moveUp();
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') moveDown();
    });

    document.getElementById("upBtn").addEventListener("click", moveUp);
    document.getElementById("downBtn").addEventListener("click", moveDown);
    canvas.addEventListener("click", () => {
      if (isGameOver) restartGame();
    });

    function gameLoop() {
      if (!isGameOver) {
        // ボール移動
        ballX += ballVx;
        ballY += ballVy;

        // 上下壁バウンド
        if (ballY <= 0 || ballY >= canvas.height) {
          ballVy *= -1;
        }

        // プレイヤー（左）打ち返し ＆ 速度少しアップ
        if (ballX <= 20 && ballY >= p1Y && ballY <= p1Y + paddleHeight) {
          ballVx = Math.abs(ballVx) * 1.1; // 1.1倍に加速
          ballVy *= 1.1;
        }

        // CPU（右）移動
        const cpuCenter = cpuY + paddleHeight / 2;
        if (cpuCenter < ballY - 10) {
          cpuY = Math.min(canvas.height - paddleHeight, cpuY + cpuSpeed);
        } else if (cpuCenter > ballY + 10) {
          cpuY = Math.max(0, cpuY - cpuSpeed);
        }

        // CPU（右）打ち返し ＆ 速度少しアップ
        if (ballX >= canvas.width - 20 && ballY >= cpuY && ballY <= cpuY + paddleHeight) {
          ballVx = -Math.abs(ballVx) * 1.1; // 1.1倍に加速
          ballVy *= 1.1;
        }

        // 得点判定
        if (ballX <= 0) {
          scoreCpu++;
          checkWinCondition();
          resetBall();
        } else if (ballX >= canvas.width) {
          scorePlayer++;
          checkWinCondition();
          resetBall();
        }
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    function checkWinCondition() {
      if (scorePlayer >= WINNING_SCORE) {
        isGameOver = true;
        statusText.textContent = "🎉 GAME CLEAR! あなたの勝ちです！";
      } else if (scoreCpu >= WINNING_SCORE) {
        isGameOver = true;
        statusText.textContent = "💀 GAME OVER... CPUの勝ちです";
      }
    }

    function resetBall() {
      ballX = 300;
      ballY = 200;
      // 速度を初期値(5)に戻す
      ballVx = (Math.random() > 0.5 ? 1 : -1) * 5;
      ballVy = (Math.random() > 0.5 ? 1 : -1) * 5;
    }

    function restartGame() {
      scorePlayer = 0;
      scoreCpu = 0;
      isGameOver = false;
      statusText.textContent = "YOU（青） vs CPU（赤） [10点先取]";
      resetBall();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 中央線
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.strokeStyle = "#fff";
      ctx.stroke();
      ctx.setLineDash([]);

      // スコア
      ctx.font = "32px sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText(scorePlayer, 200, 50);
      ctx.fillText(scoreCpu, 380, 50);

      // プレイヤー（左）
      ctx.fillStyle = "#00aaff";
      ctx.fillRect(10, p1Y, paddleWidth, paddleHeight);

      // CPU（右）
      ctx.fillStyle = "#ff4444";
      ctx.fillRect(canvas.width - 20, cpuY, paddleWidth, paddleHeight);

      // ボール
      ctx.fillStyle = "#ffff00";
      ctx.beginPath();
      ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
      ctx.fill();

      // 勝敗画面テキスト
      if (isGameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "36px sans-serif";
        ctx.fillStyle = scorePlayer >= WINNING_SCORE ? "#00ffcc" : "#ff4444";
        ctx.textAlign = "center";
        const msg = scorePlayer >= WINNING_SCORE ? "GAME CLEAR!!" : "GAME OVER";
        ctx.fillText(msg, canvas.width / 2, 180);

        ctx.font = "20px sans-serif";
        ctx.fillStyle = "#fff";
        ctx.fillText("画面タップ または スペースキーでリスタート", canvas.width / 2, 240);
        ctx.textAlign = "start";
      }
    }

    gameLoop();
  </script>
</body>
</html>
