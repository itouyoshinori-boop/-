<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2Dテニス（効果音付き）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
      touch-action: manipulation;
    }
    #gameContainer {
      display: inline-block;
      position: relative;
    }
    canvas {
      background: #000;
      border: 3px solid #fff;
      display: block;
      margin: 10px auto;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    .status {
      font-size: 18px;
      margin-bottom: 8px;
      color: #00ffcc;
      font-weight: bold;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .btn {
      width: 110px;
      height: 75px;
      font-size: 32px;
      background: #333;
      color: white;
      border: 2px solid #666;
      border-radius: 12px;
      cursor: pointer;
      touch-action: none;
    }
    .btn:active { background: #00aaff; }
  </style>
</head>
<body>

  <h1>2Dテニス</h1>
  <div class="status" id="statusText">YOU（青） vs CPU（赤） [10点先取]</div>
  
  <div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
  </div>

  <div class="controls">
    <button class="btn" id="upBtn">▲</button>
    <button class="btn" id="downBtn">▼</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText");

    // --- 効果音生成（Web Audio API） ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'playerHit') { // 自機ヒット
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'cpuHit') { // CPUヒット
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'wallHit') { // 壁バウンド
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'scorePlayer') { // 得点
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'scoreCpu') { // 失点
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'clear') { // 勝利
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, now + idx * 0.12);
          g.gain.setValueAtTime(0.25, now + idx * 0.12);
          g.gain.linearRampToValueAtTime(0, now + idx * 0.12 + 0.25);
          o.start(now + idx * 0.12);
          o.stop(now + idx * 0.12 + 0.25);
        });
      } else if (type === 'over') { // 敗北
        const notes = [400, 350, 300, 250];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(freq, now + idx * 0.15);
          g.gain.setValueAtTime(0.2, now + idx * 0.15);
          g.gain.linearRampToValueAtTime(0, now + idx * 0.15 + 0.3);
          o.start(now + idx * 0.15);
          o.stop(now + idx * 0.15 + 0.3);
        });
      }
    }

    // --- ゲーム変数 ---
    let p1Y = 160;
    let cpuY = 160;
    let ballX = 300;
    let ballY = 200;
    
    // ちょうどいい標準速度（5.0）
    let ballVx = 5.0;
    let ballVy = 5.0;
    let scorePlayer = 0;
    let scoreCpu = 0;
    let isGameOver = false;

    const paddleHeight = 80;
    const paddleWidth = 10;
    const playerSpeed = 14; 
    const cpuSpeed = 4.5;   
    const WINNING_SCORE = 10;

    const keys = { up: false, down: false };

    // キーボード操作
    window.addEventListener("keydown", (e) => {
      initAudio();
      if (isGameOver && e.key === ' ') { restartGame(); return; }
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.up = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = true;
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.up = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = false;
    });

    // ボタン操作の設定
    const upBtn = document.getElementById("upBtn");
    const downBtn = document.getElementById("downBtn");

    const bindControl = (btn, dir) => {
      const start = (e) => { 
        initAudio();
        if(e.cancelable) e.preventDefault(); 
        keys[dir] = true; 
      };
      const end = (e) => { 
        if(e.cancelable) e.preventDefault(); 
        keys[dir] = false; 
      };
      btn.addEventListener("touchstart", start, { passive: false });
      btn.addEventListener("touchend", end, { passive: false });
      btn.addEventListener("mousedown", start);
      btn.addEventListener("mouseup", end);
      btn.addEventListener("mouseleave", end);
    };

    bindControl(upBtn, "up");
    bindControl(downBtn, "down");

    // タッチ・ドラッグ操作
    function handleTouchCanvas(e) {
      initAudio();
      if (isGameOver) {
        restartGame();
        return;
      }
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const touchY = touch.clientY - rect.top;
      const scaleY = canvas.height / rect.height;
      
      p1Y = (touchY * scaleY) - (paddleHeight / 2);
      p1Y = Math.max(0, Math.min(canvas.height - paddleHeight, p1Y));
    }

    canvas.addEventListener("touchstart", handleTouchCanvas, { passive: false });
    canvas.addEventListener("touchmove", handleTouchCanvas, { passive: false });

    canvas.addEventListener("click", () => {
      initAudio();
      if (isGameOver) restartGame();
    });

    function update() {
      if (isGameOver) return;

      if (keys.up) p1Y = Math.max(0, p1Y - playerSpeed);
      if (keys.down) p1Y = Math.min(canvas.height - paddleHeight, p1Y + playerSpeed);

      ballX += ballVx;
      ballY += ballVy;

      // 上下壁バウンド音
      if (ballY <= 8 || ballY >= canvas.height - 8) {
        ballVy *= -1;
        playSound('wallHit');
      }

      // プレイヤー（左）打ち返し（ほどよい加速 1.05）
      if (ballX <= 20 && ballY >= p1Y && ballY <= p1Y + paddleHeight) {
        ballVx = Math.abs(ballVx) * 1.05;
        ballVy *= 1.05;
        playSound('playerHit');
      }

      // CPU（右）移動
      const cpuCenter = cpuY + paddleHeight / 2;
      if (cpuCenter < ballY - 12) {
        cpuY = Math.min(canvas.height - paddleHeight, cpuY + cpuSpeed);
      } else if (cpuCenter > ballY + 12) {
        cpuY = Math.max(0, cpuY - cpuSpeed);
      }

      // CPU（右）打ち返し
      if (ballX >= canvas.width - 20 && ballY >= cpuY && ballY <= cpuY + paddleHeight) {
        ballVx = -Math.abs(ballVx) * 1.05;
        ballVy *= 1.05;
        playSound('cpuHit');
      }

      // 得点判定＆効果音
      if (ballX <= 0) {
        scoreCpu++;
        playSound('scoreCpu');
        checkWinCondition();
        resetBall();
      } else if (ballX >= canvas.width) {
        scorePlayer++;
        playSound('scorePlayer');
        checkWinCondition();
        resetBall();
      }
    }

    function checkWinCondition() {
      if (scorePlayer >= WINNING_SCORE) {
        isGameOver = true;
        statusText.textContent = "🎉 GAME CLEAR! あなたの勝ちです！";
        playSound('clear');
      } else if (scoreCpu >= WINNING_SCORE) {
        isGameOver = true;
        statusText.textContent = "💀 GAME OVER... CPUの勝ちです";
        playSound('over');
      }
    }

    function resetBall() {
      ballX = 300;
      ballY = 200;
      ballVx = (Math.random() > 0.5 ? 1 : -1) * 5.0;
      ballVy = (Math.random() > 0.5 ? 1 : -1) * 5.0;
    }

    function restartGame() {
      scorePlayer = 0;
      scoreCpu = 0;
      isGameOver = false;
      statusText.textContent = "YOU（青） vs CPU（赤） [10点先取]";
      resetBall();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.strokeStyle = "#fff";
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = "32px sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText(scorePlayer, 200, 50);
      ctx.fillText(scoreCpu, 380, 50);

      ctx.fillStyle = "#00aaff";
      ctx.fillRect(10, p1Y, paddleWidth, paddleHeight);

      ctx.fillStyle = "#ff4444";
      ctx.fillRect(canvas.width - 20, cpuY, paddleWidth, paddleHeight);

      ctx.fillStyle = "#ffff00";
      ctx.beginPath();
      ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
      ctx.fill();

      if (isGameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "36px sans-serif";
        ctx.fillStyle = scorePlayer >= WINNING_SCORE ? "#00ffcc" : "#ff4444";
        ctx.textAlign = "center";
        const msg = scorePlayer >= WINNING_SCORE ? "GAME CLEAR!!" : "GAME OVER";
        ctx.fillText(msg, canvas.width / 2, 180);

        ctx.font = "20px sans-serif";
        ctx.fillStyle = "#fff";
        ctx.fillText("画面タップ または ボタンでリスタート", canvas.width / 2, 240);
        ctx.textAlign = "start";
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
