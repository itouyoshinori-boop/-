<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンラインリアルタイムテニス</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
    }
    #gameContainer {
      display: inline-block;
      position: relative;
    }
    canvas {
      background: #000;
      border: 3px solid #fff;
      display: block;
      margin: 10px auto;
      max-width: 100%;
      height: auto;
    }
    .status {
      font-size: 16px;
      margin-bottom: 8px;
      color: #00ffcc;
      font-weight: bold;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .btn {
      width: 80px;
      height: 60px;
      font-size: 24px;
      background: #444;
      color: white;
      border: 2px solid #666;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:active { background: #666; }
    .reset-btn {
      margin-top: 15px;
      padding: 8px 16px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>オンライン2Dテニス</h1>
  <div id="status" class="status">接続中...</div>
  
  <div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
  </div>

  <!-- スマホ用タッチボタン -->
  <div class="controls">
    <button class="btn" id="upBtn">▲</button>
    <button class="btn" id="downBtn">▼</button>
  </div>

  <button class="reset-btn" id="resetBtn">部屋をリセット</button>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase設定（ご自身のAPIキー等に差し替えてください）
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForNetKeijiban",
      authDomain: "net-keijiban.firebaseapp.com",
      projectId: "net-keijiban",
      storageBucket: "net-keijiban.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const gameRef = doc(db, "games", "tennis_room");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let playerRole = null;
    const initialGameState = {
      p1Y: 160, p2Y: 160,
      ballX: 300, ballY: 200,
      ballVx: 4, ballVy: 4,
      score1: 0, score2: 0,
      p1Online: false, p2Online: false
    };
    let gameState = { ...initialGameState };

    const paddleHeight = 80;
    const paddleWidth = 10;

    async function joinGame() {
      onSnapshot(gameRef, (snapshot) => {
        if (snapshot.exists()) {
          gameState = { ...gameState, ...snapshot.data() };
          draw();
        } else {
          setDoc(gameRef, initialGameState);
        }
      });

      setTimeout(async () => {
        if (!gameState.p1Online) {
          playerRole = 'p1';
          await updateDoc(gameRef, { p1Online: true });
          statusEl.textContent = "あなたは PLAYER 1（左）です。対戦相手を待っています...";
        } else if (!gameState.p2Online) {
          playerRole = 'p2';
          await updateDoc(gameRef, { p2Online: true });
          statusEl.textContent = "あなたは PLAYER 2（右）です。対戦開始！";
        } else {
          statusEl.textContent = "満員です（観戦モード）";
        }
      }, 1000);
    }

    function moveUp() {
      if (!playerRole) return;
      if (playerRole === 'p1') {
        gameState.p1Y = Math.max(0, gameState.p1Y - 20);
        updateDoc(gameRef, { p1Y: gameState.p1Y });
      } else if (playerRole === 'p2') {
        gameState.p2Y = Math.max(0, gameState.p2Y - 20);
        updateDoc(gameRef, { p2Y: gameState.p2Y });
      }
    }

    function moveDown() {
      if (!playerRole) return;
      if (playerRole === 'p1') {
        gameState.p1Y = Math.min(canvas.height - paddleHeight, gameState.p1Y + 20);
        updateDoc(gameRef, { p1Y: gameState.p1Y });
      } else if (playerRole === 'p2') {
        gameState.p2Y = Math.min(canvas.height - paddleHeight, gameState.p2Y + 20);
        updateDoc(gameRef, { p2Y: gameState.p2Y });
      }
    }

    // キーボード＆ボタンイベント
    window.addEventListener("keydown", (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') moveUp();
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') moveDown();
    });

    document.getElementById("upBtn").addEventListener("click", moveUp);
    document.getElementById("downBtn").addEventListener("click", moveDown);

    document.getElementById("resetBtn").addEventListener("click", async () => {
      await setDoc(gameRef, initialGameState);
      location.reload();
    });

    // ボール計算（P1メイン）
    setInterval(() => {
      if (playerRole === 'p1' && gameState.p1Online && gameState.p2Online) {
        let bx = gameState.ballX + gameState.ballVx;
        let by = gameState.ballY + gameState.ballVy;

        if (by <= 0 || by >= canvas.height) gameState.ballVy *= -1;

        if (bx <= 20 && by >= gameState.p1Y && by <= gameState.p1Y + paddleHeight) gameState.ballVx *= -1;
        if (bx >= canvas.width - 20 && by >= gameState.p2Y && by <= gameState.p2Y + paddleHeight) gameState.ballVx *= -1;

        if (bx <= 0) { gameState.score2++; bx = 300; by = 200; }
        else if (bx >= canvas.width) { gameState.score1++; bx = 300; by = 200; }

        gameState.ballX = bx;
        gameState.ballY = by;

        updateDoc(gameRef, {
          ballX: bx, ballY: by,
          ballVx: gameState.ballVx, ballVy: gameState.ballVy,
          score1: gameState.score1, score2: gameState.score2
        });
      }
    }, 30);

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.strokeStyle = "#fff";
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = "32px sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText(gameState.score1, 200, 50);
      ctx.fillText(gameState.score2, 380, 50);

      ctx.fillStyle = "#00aaff";
      ctx.fillRect(10, gameState.p1Y, paddleWidth, paddleHeight);

      ctx.fillStyle = "#ff4444";
      ctx.fillRect(canvas.width - 20, gameState.p2Y, paddleWidth, paddleHeight);

      ctx.fillStyle = "#ffff00";
      ctx.beginPath();
      ctx.arc(gameState.ballX, gameState.ballY, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    joinGame();
  </script>
</body>
</html>
